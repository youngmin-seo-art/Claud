name: Deploy AdSense Blog to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write   # SEO 정리 결과와 네이버/티스토리 초안을 저장소에 다시 커밋하기 위해 필요
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 글 최초 발행일을 git 이력에서 찾기 위해 전체 이력 필요

      - name: Python 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 배포 전에 항상 실행 → 어떤 경로로 글을 올려도 아래 문제가 다시 생기지 않음
      #  - 같은 글을 가리키는 중복 카드 제거
      #  - sitemap/RSS 날짜 고정(재배포 때마다 '오늘'로 바뀌지 않음), 설명 잘림 수정
      # 상단 시세 띠에 표시할 실제 시세를 배포 때마다 갱신 (실패해도 배포는 계속)
      - name: 시세 데이터 갱신 (market-summary.json)
        run: python stock-blog-agent/fetch_live_market.py || echo "시세 갱신 실패 - 기존 데이터 유지"

      - name: SEO 정리 (중복 카드 · sitemap · RSS)
        run: |
          python stock-blog-agent/dedupe_index_cards.py
          rm -f adsense-stock-blog/index.html.bak
          python stock-blog-agent/fix_all_seo_and_sitemap.py

      - name: 네이버 블로그 · 티스토리 요약 초안 생성
        run: python stock-blog-agent/make_syndication_drafts.py

      - name: 정리 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add adsense-stock-blog syndication stock-blog-agent/post_dates.json
          # rss.xml의 lastBuildDate만 바뀐 경우는 커밋하지 않음
          if git diff --cached --quiet -- . ':(exclude)adsense-stock-blog/rss.xml' ; then
            git reset -q
            echo "커밋할 변경 없음"
          else
            git commit -m "chore(seo): 배포 전 SEO 정리 및 네이버/티스토리 초안 갱신"
            # GITHUB_TOKEN으로 한 push는 워크플로를 다시 실행시키지 않으므로 무한 반복 없음
            git push origin HEAD:main || echo "push 실패 - 다음 배포 때 다시 반영됩니다"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'adsense-stock-blog'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
