<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Neon Cyan to Violet Gradient -->
    <linearGradient id="neonGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="40%" stop-color="#4facfe"/>
      <stop offset="80%" stop-color="#8a2be2"/>
      <stop offset="100%" stop-color="#b14bf4"/>
    </linearGradient>

    <!-- Reverse / Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b14bf4"/>
      <stop offset="60%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#00f2fe" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="500" rx="60" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle circular border -->
  <circle cx="250" cy="220" r="160" fill="none" stroke="url(#neonGrad1)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.25"/>

  <!-- Geometric Interlocking VSL Symbol -->
  <g transform="translate(250, 215)" filter="url(#softShadow)">
    <!-- Letter 'V' Left Stem -->
    <path d="M -110 -80 L -40 85 L -20 85 L -90 -80 Z" fill="url(#neonGrad1)"/>
    
    <!-- Letter 'V' Right Stem / Base connecting -->
    <path d="M -40 85 L -10 15 L 10 15 L -20 85 Z" fill="url(#neonGrad1)"/>

    <!-- Letter 'S' Middle Flow -->
    <path d="M -45 -45 C -45 -75, 45 -85, 55 -50 C 65 -15, -35 5, -25 45 C -15 80, 65 75, 75 45 L 55 45 C 45 60, 0 65, -5 45 C -12 25, 80 5, 75 -45 C 70 -85, -25 -95, -45 -45 Z" fill="url(#accentGrad)"/>

    <!-- Letter 'L' Structure -->
    <path d="M 25 -40 L 45 -40 L 45 55 L 115 55 L 115 75 L 25 75 Z" fill="url(#neonGrad1)"/>
  </g>

  <!-- Blog Brand Typography -->
  <text x="250" y="405" text-anchor="middle" font-family="'Inter', 'Montserrat', 'Pretendard', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="12">VSL LOG</text>
  <text x="250" y="435" text-anchor="middle" font-family="'Inter', 'Pretendard', sans-serif" font-weight="500" font-size="12" fill="#94a3b8" letter-spacing="4">TECH &amp; CREATIVE INSIGHTS</text>
</svg>
