name: Auto Stock Blog AI Agent

on:
  schedule:
    # 1. 매일 아침 8시 정각 (KST 08:00 = UTC 23:00): 오늘의 증시 모닝 시황 브리핑 자동 발행
    - cron: '0 23 * * *'
    # 2. 매일 오후 4시 30분 (KST 16:30 = UTC 07:30): 장 마감 후 당일 주도주 리서치 자동 발행
    - cron: '30 7 * * *'
  workflow_dispatch:        # GitHub Actions 웹 탭에서 언제든 수동 실행 가능

permissions:
  contents: write

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Python 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Git 기본 사용자 설정
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 오늘의 증시 브리핑 및 주식 분석글 자동 발행
        run: |
          cd stock-blog-agent
          # UTC 시간에 따라 오전 시간대(UTC 22, 23, 0, 1 = KST 07:00~10:00)에는 모닝 브리핑, 그 외에는 핫이슈 분석 실행
          CURRENT_HOUR=$(date -u +%H)
          echo "현재 UTC 시간(시): $CURRENT_HOUR"
          if [ "$CURRENT_HOUR" -eq 22 ] || [ "$CURRENT_HOUR" -eq 23 ] || [ "$CURRENT_HOUR" -eq 0 ] || [ "$CURRENT_HOUR" -eq 1 ]; then
            python run.py --morning
          else
            python run.py --auto
          fi
