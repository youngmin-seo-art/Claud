<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a0f"/>
      <stop offset="50%" stop-color="#0f0c13"/>
      <stop offset="100%" stop-color="#050307"/>
    </linearGradient>

    <!-- Crimson & Ruby Red Neon Gradient -->
    <linearGradient id="crimsonNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="35%" stop-color="#f43f5e"/>
      <stop offset="70%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <!-- Reverse / Accent Red Gradient -->
    <linearGradient id="crimsonAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9f1239"/>
      <stop offset="50%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#ff5252"/>
    </linearGradient>

    <!-- Red Glow Filter -->
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="crimsonShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#ff1744" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="500" rx="60" fill="url(#bgGradRed)"/>
  
  <!-- Outer subtle circular border -->
  <circle cx="250" cy="220" r="160" fill="none" stroke="url(#crimsonNeonGrad)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.3"/>

  <!-- Geometric Interlocking VSL Symbol (Red Edition) -->
  <g transform="translate(250, 215)" filter="url(#crimsonShadow)">
    <!-- Letter 'V' Left Stem -->
    <path d="M -110 -80 L -40 85 L -20 85 L -90 -80 Z" fill="url(#crimsonNeonGrad)"/>
    
    <!-- Letter 'V' Right Stem / Base connecting -->
    <path d="M -40 85 L -10 15 L 10 15 L -20 85 Z" fill="url(#crimsonNeonGrad)"/>

    <!-- Letter 'S' Middle Flow -->
    <path d="M -45 -45 C -45 -75, 45 -85, 55 -50 C 65 -15, -35 5, -25 45 C -15 80, 65 75, 75 45 L 55 45 C 45 60, 0 65, -5 45 C -12 25, 80 5, 75 -45 C 70 -85, -25 -95, -45 -45 Z" fill="url(#crimsonAccent)"/>

    <!-- Letter 'L' Structure -->
    <path d="M 25 -40 L 45 -40 L 45 55 L 115 55 L 115 75 L 25 75 Z" fill="url(#crimsonNeonGrad)"/>
  </g>

  <!-- Blog Brand Typography -->
  <text x="250" y="405" text-anchor="middle" font-family="'Inter', 'Montserrat', 'Pretendard', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="12">VSL LOG</text>
  <text x="250" y="435" text-anchor="middle" font-family="'Inter', 'Pretendard', sans-serif" font-weight="500" font-size="12" fill="#fda4af" letter-spacing="4">RED TECH &amp; INSIGHTS</text>
</svg>
