<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ribbonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Sunset Flame Gradient for Ribbon -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="35%" stop-color="#ff5e62"/>
      <stop offset="70%" stop-color="#ff9966"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="50%" stop-color="#ff0080"/>
      <stop offset="100%" stop-color="#ff4b4b"/>
    </linearGradient>

    <filter id="softRibbonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#ff3366" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="60" fill="url(#ribbonBg)"/>
  
  <!-- Subtle Background Pattern -->
  <circle cx="250" cy="220" r="140" fill="#f1f5f9" opacity="0.6"/>

  <!-- Fluid Ribbon VSL Shape -->
  <g transform="translate(250, 215)" filter="url(#softRibbonShadow)">
    <!-- 'V' Part -->
    <path d="M -115 -70 Q -95 -75 -80 -40 L -45 50 Q -35 70 -20 70 Q -5 70 5 45 L 30 -20" 
          fill="none" stroke="url(#flameGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 'S' Part -->
    <path d="M -10 -45 C -10 -75 40 -75 40 -40 C 40 -5 -30 5 -30 45 C -30 80 25 80 35 50" 
          fill="none" stroke="url(#purpleGrad)" stroke-width="24" stroke-linecap="round"/>

    <!-- 'L' Part -->
    <path d="M 55 -60 L 55 50 Q 55 68 75 68 L 115 68" 
          fill="none" stroke="url(#flameGrad)" stroke-width="24" stroke-linecap="round"/>
  </g>

  <!-- Blog Typography -->
  <text x="250" y="395" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', 'Pretendard', sans-serif" font-weight="900" font-size="32" fill="#0f172a" letter-spacing="8">VSL</text>
  <text x="250" y="425" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="600" font-size="13" fill="#64748b" letter-spacing="4">DAILY STORY &amp; TRENDS</text>
</svg>
