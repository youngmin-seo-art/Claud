<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 160" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#b14bf4"/>
    </linearGradient>
    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00f2fe" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Left Icon Symbol -->
  <g transform="translate(80, 80) scale(0.65)" filter="url(#hGlow)">
    <!-- Symbol Box -->
    <rect x="-90" y="-90" width="180" height="180" rx="42" fill="#0f172a" stroke="url(#headerGrad)" stroke-width="3"/>
    <!-- Interlocking VSL inside Icon -->
    <path d="M -50 -35 L -18 45 L -8 45 L -40 -35 Z" fill="url(#headerGrad)"/>
    <path d="M -18 45 L -3 10 L 7 10 L -8 45 Z" fill="url(#headerGrad)"/>
    <path d="M -22 -20 C -22 -35, 20 -40, 25 -22 C 30 -5, -15 2, -10 20 C -5 36, 30 34, 35 20 L 25 20 C 20 28, -2 30, -3 20 C -6 10, 36 2, 34 -20 C 30 -40, -12 -45, -22 -20 Z" fill="#38bdf8"/>
    <path d="M 12 -18 L 22 -18 L 22 28 L 50 28 L 50 38 L 12 38 Z" fill="url(#headerGrad)"/>
  </g>

  <!-- Brand Text & Slogan -->
  <g transform="translate(180, 72)">
    <text x="0" y="10" font-family="'Plus Jakarta Sans', 'Inter', 'Pretendard', sans-serif" font-weight="900" font-size="44" fill="#0f172a" letter-spacing="4">
      VSL<tspan fill="url(#headerGrad)">.LOG</tspan>
    </text>
    <text x="5" y="38" font-family="'Inter', 'Pretendard', sans-serif" font-weight="600" font-size="14" fill="#64748b" letter-spacing="3">
      INSIGHT &amp; STORYTELLING
    </text>
  </g>
</svg>
