name: Auto Stock Blog AI Agent

# [자동 업로드 중단됨] 정기 자동 발행(cron)이 비활성화되었습니다.
# 필요 시 GitHub 웹의 Actions 탭에서 workflow_dispatch(수동 실행)로만 동작합니다.
on:
  workflow_dispatch:        # 수동 실행 전용 (자동 cron 비활성화)


permissions:
  contents: write

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Python 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Git 기본 사용자 설정
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 오늘의 증시 브리핑 및 주식 분석글 자동 발행
        run: |
          cd stock-blog-agent
          # UTC 시간에 따라 오전 시간대(UTC 22, 23, 0, 1 = KST 07:00~10:00)에는 모닝 브리핑, 그 외에는 핫이슈 분석 실행
          CURRENT_HOUR=$(date -u +%H)
          echo "현재 UTC 시간(시): $CURRENT_HOUR"
          if [ "$CURRENT_HOUR" -eq 22 ] || [ "$CURRENT_HOUR" -eq 23 ] || [ "$CURRENT_HOUR" -eq 0 ] || [ "$CURRENT_HOUR" -eq 1 ]; then
            python run.py --morning
          else
            python run.py --auto
          fi

      - name: 변경 사항 원격 저장소 푸시 (안전장치)
        run: |
          git status
          if [ -n "$(git status --porcelain)" ]; then
            git add adsense-stock-blog stock-blog-agent/published_history.json
            git commit -m "feat(agent): [GitHub Actions 자동발행] 증시 시황 및 주식 분석글 업데이트"
            git push origin main
          else
            echo "변경사항이 이미 푸시되었습니다."
          fi

