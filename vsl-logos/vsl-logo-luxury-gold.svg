<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dark Luxury Background -->
    <linearGradient id="darkGoldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="50%" stop-color="#0a0a0d"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="metallicGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="15%" stop-color="#edd59e"/>
      <stop offset="45%" stop-color="#c59b27"/>
      <stop offset="70%" stop-color="#f7e5b3"/>
      <stop offset="90%" stop-color="#9a741c"/>
      <stop offset="100%" stop-color="#dfbc69"/>
    </linearGradient>

    <linearGradient id="goldStroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a741c"/>
      <stop offset="50%" stop-color="#f7e5b3"/>
      <stop offset="100%" stop-color="#c59b27"/>
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#c59b27" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="60" fill="url(#darkGoldBg)"/>

  <!-- Luxury Emblem Ring -->
  <g transform="translate(250, 215)" filter="url(#goldGlow)">
    <!-- Outer Dual Crest Ring -->
    <circle cx="0" cy="0" r="145" fill="none" stroke="url(#goldStroke)" stroke-width="2"/>
    <circle cx="0" cy="0" r="138" fill="none" stroke="url(#goldStroke)" stroke-width="1" stroke-dasharray="4 6" opacity="0.6"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#goldStroke)" stroke-width="1.5"/>

    <!-- Decorative Diamonds on Crest -->
    <polygon points="0,-148 5,-140 0,-132 -5,-140" fill="url(#metallicGold)"/>
    <polygon points="0,148 5,140 0,132 -5,140" fill="url(#metallicGold)"/>
    <polygon points="-148,0 -140,5 -132,0 -140,-5" fill="url(#metallicGold)"/>
    <polygon points="148,0 140,5 132,0 140,-5" fill="url(#metallicGold)"/>

    <!-- VSL Interlaced Typography Monogram -->
    <!-- 'V' -->
    <path d="M -85 -65 L -35 60 L -15 60 L -60 -65 Z" fill="url(#metallicGold)"/>
    <path d="M -35 60 L 5 -35 L -10 -35 L -45 40 Z" fill="url(#metallicGold)" opacity="0.9"/>

    <!-- 'S' Serif Monogram Curve -->
    <path d="M -30 -30 C -30 -65, 30 -75, 45 -40 C 58 -10, -35 5, -20 45 C -10 75, 55 70, 60 40 L 42 38 C 38 52, 5 55, -2 38 C -10 18, 75 8, 62 -42 C 50 -82, -15 -80, -30 -30 Z" fill="url(#metallicGold)"/>

    <!-- 'L' -->
    <path d="M 15 -35 L 35 -35 L 35 42 L 80 42 L 80 58 L 15 58 Z" fill="url(#metallicGold)"/>
  </g>

  <!-- Typography -->
  <text x="250" y="405" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-weight="700" font-size="28" fill="url(#metallicGold)" letter-spacing="14">V S L</text>
  <text x="250" y="435" text-anchor="middle" font-family="'Inter', 'Pretendard', sans-serif" font-weight="400" font-size="11" fill="#a1a1aa" letter-spacing="6">EST. 2026 &bull; PREMIUM BLOG</text>
</svg>
