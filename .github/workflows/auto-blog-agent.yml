name: Auto Stock Blog AI Agent

on:
  schedule:
    # 한국 시간 기준 매일 오전 8시 30분(장 시작 전) 및 오후 4시 30분(장 마감 후) 자동 실행
    - cron: '30 23 * * *'  # UTC 23:30 = KST 08:30
    - cron: '30 7 * * *'   # UTC 07:30 = KST 16:30
  workflow_dispatch:        # GitHub 웹에서 수동으로 'Run workflow' 버튼 클릭 실행 가능

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: AI 에이전트 실행 (자동 뉴스 수집 & 포스팅)
        run: |
          cd stock-blog-agent
          python run.py --auto
